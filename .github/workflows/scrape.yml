name: Weekly Offer Scraper

on:
  schedule:
    - cron: '0 6 * * 1' # Körs varje måndag kl 08:00 (svensk tid)
  workflow_dispatch: # Gör att du kan starta skrapan manuellt från GitHub

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Run Scraper Script
        run: node fetch-data.js

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update offer data" || exit 0
          git push
