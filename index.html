<html lang="sv">
<head>
 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
<!-- För iOS / iPhone support -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rabatter">
<link rel="apple-touch-icon" href="icon-192.png">
  <title>Rabattsök</title>
  <style>
    /* 1. Standardfärger (Ljust läge) */
    :root {
      --bg-color: #f4f6f8;
      --text-color: #1a1a1a;
      --text-muted: #666666;
      --card-bg: #ffffff;
      --card-shadow: rgba(0, 0, 0, 0.08);
      --card-shadow-hover: rgba(0, 0, 0, 0.12);
      --input-border: #dddddd;
      --input-bg: #ffffff;
      --img-bg: #eeeeee;
      --primary: #0066cc;
      --primary-hover: #0052a3;
      --skeleton-base: #e2e8f0;
      --skeleton-highlight: #f1f5f9;
    }

    /* 2. Automatisk Dark Mode utifrån enhetens inställningar */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #0f172a;
        --text-color: #f8fafc;
        --text-muted: #94a3b8;
        --card-bg: #1e293b;
        --card-shadow: rgba(0, 0, 0, 0.3);
        --card-shadow-hover: rgba(0, 0, 0, 0.5);
        --input-border: #334155;
        --input-bg: #1e293b;
        --img-bg: #334155;
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --skeleton-base: #334155;
        --skeleton-highlight: #475569;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 15px;
      font-size: 2rem;
    }

    .search-box {
      width: 100%;
      max-width: 600px;
      padding: 14px 20px;
      font-size: 1.1rem;
      background-color: var(--input-bg);
      color: var(--text-color);
      border: 2px solid var(--input-border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .search-box:focus {
      border-color: var(--primary);
    }

    .stats {
      margin-top: 10px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--card-shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 12px var(--card-shadow-hover);
    }

    .card-img-wrapper {
      position: relative;
      height: 180px;
      background-color: var(--img-bg);
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      color: #fff;
      text-transform: uppercase;
    }

    .badge-mecenat { background-color: #e63946; }
    .badge-hyresgast { background-color: #2a9d8f; }
    .badge-ica { background-color: #e02828; }
    .badge-coop { background-color: #008744; }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .card-link {
      display: inline-block;
      text-align: center;
      padding: 10px;
      background-color: var(--primary);
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    .card-link:hover {
      background-color: var(--primary-hover);
    }

    /* Skeleton Placeholder Styles */
    .skeleton-card {
      pointer-events: none;
    }

    .skeleton-box {
      background: linear-gradient(
        90deg,
        var(--skeleton-base) 25%,
        var(--skeleton-highlight) 50%,
        var(--skeleton-base) 75%
      );
      background-size: 200% 100%;
      animation: skeleton-loading 1.5s infinite;
      border-radius: 4px;
    }

    .skeleton-img {
      width: 100%;
      height: 180px;
      border-radius: 0;
    }

    .skeleton-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 60px;
      height: 20px;
      border-radius: 20px;
    }

    .skeleton-title-1 {
      width: 90%;
      height: 16px;
      margin-bottom: 8px;
    }

    .skeleton-title-2 {
      width: 60%;
      height: 16px;
      margin-bottom: 25px;
    }

    .skeleton-btn {
      width: 100%;
      height: 38px;
      border-radius: 6px;
    }

    @keyframes skeleton-loading {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    function getExtraKeywords(title = '') {
      const lowerTitle = title.toLowerCase();
      let extra = [];

      for (const [brand, keywords] of Object.entries(BRAND_KEYWORDS)) {
        const safeBrand = brand.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(`(?:^|\\s|\\b)${safeBrand}(?:$|\\s|\\b)`, 'i');

        if (regex.test(lowerTitle)) {
          extra.push(keywords);
        }
      }

      return extra.join(' ');
    }

    let allDeals = [];

    function seededRandom(seed) {
      return function() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      };
    }

    function shuffleArray(array, seed = 42) {
      const rng = seededRandom(seed);
      const shuffled = [...array];
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(rng() * (i + 1));
        [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
      }
      return shuffled;
    }

    function showSkeletonPlaceholders(count = 8) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      
      for (let i = 0; i < count; i++) {
        const skeletonCard = document.createElement('div');
        skeletonCard.className = 'card skeleton-card';
        skeletonCard.innerHTML = `
          <div class="card-img-wrapper">
            <div class="skeleton-box skeleton-img"></div>
            <div class="skeleton-box skeleton-badge"></div>
          </div>
          <div class="card-content">
            <div>
              <div class="skeleton-box skeleton-title-1"></div>
              <div class="skeleton-box skeleton-title-2"></div>
            </div>
            <div class="skeleton-box skeleton-btn"></div>
          </div>
        `;
        grid.appendChild(skeletonCard);
      }
    }

    async function loadData() {
      showSkeletonPlaceholders(8);

     // Fördröjning på 1.5 sekunder för att visa skeleton-animationen
      await new Promise(resolve => setTimeout(resolve, 1500));
     

      try {
        const res = await fetch('./data.json');
        if (!res.ok) throw new Error(`Kunde inte ladda data.json (Status ${res.status})`);
        
        const data = await res.json();

        // 1. Mecenat Alumni
        let mecenatItems = [];
        if (data.mecenat && data.mecenat.discounts) {
          mecenatItems = data.mecenat.discounts.map(item => {
            const fullTitle = item.brandName ? `${item.brandName}: ${item.title}` : item.title;
            const sourceName = 'Mecenat Alumni';
            
            const rawContent = item.content ? item.content.replace(/<[^>]*>?/gm, '') : '';
            const rawCondition = item.conditionHTML ? item.conditionHTML.replace(/<[^>]*>?/gm, '') : '';
            const extraKeywords = getExtraKeywords(fullTitle);

            const searchIndex = [
              fullTitle,
              sourceName,
              rawContent,
              rawCondition,
              item.subtitle,
              item.mainCategoryName,
              extraKeywords
            ].filter(Boolean).join(' ').toLowerCase();

            return {
              title: fullTitle,
              searchText: searchIndex,
              image: item.image || PLACEHOLDER_IMG,
              url: item.url ? `https://www.mecenatalumni.com${item.url}` : '#',
              source: sourceName,
              sourceClass: 'badge-mecenat'
            };
          });
        }

        // 2. Hyresgästföreningen
        let hyresgastItems = [];
        if (data.hyresgast && data.hyresgast.items) {
          hyresgastItems = data.hyresgast.items.map(item => {
            let brandName = '';
            const sourceName = 'Hyresgästföreningen';
            
            if (item.url) {
              const segments = item.url.split('/').filter(Boolean);
              if (segments.length > 0) {
                const slug = segments[segments.length - 1];
                brandName = slug.split('-')
                  .map(word => word.charAt(0).toUpperCase() + word.slice(1))
                  .join(' ');
              }
            }

            const fullTitle = brandName ? `${brandName}: ${item.title}` : item.title;
            const extraKeywords = getExtraKeywords(fullTitle);

            const searchIndex = [
              fullTitle,
              sourceName,
              item.imageAlt,
              item.description,
              extraKeywords
            ].filter(Boolean).join(' ').toLowerCase();

            return {
              title: fullTitle,
              searchText: searchIndex,
              image: item.imageUrl ? `https://www.hyresgastforeningen.se${item.imageUrl}` : PLACEHOLDER_IMG,
              url: item.url ? `https://www.hyresgastforeningen.se${item.url}` : '#',
              source: sourceName,
              sourceClass: 'badge-hyresgast'
            };
          });
        }

        // 3. ICA Stammis
        let icaItems = [];
        if (Array.isArray(data.ica)) {
          icaItems = data.ica.map(item => {
            const sourceName = 'ICA Stammis';
            const fullTitle = item.title || item.name || '';
            const extraKeywords = getExtraKeywords(fullTitle);

            const searchIndex = [
              fullTitle,
              sourceName,
              item.description,
              item.searchText,
              extraKeywords
            ].filter(Boolean).join(' ').toLowerCase();

            return {
              ...item,
              title: fullTitle,
              searchText: searchIndex,
              source: sourceName,
              sourceClass: 'badge-ica'
            };
          });
        }

        // 4. Coop Medlem
        let coopItems = [];
        if (Array.isArray(data.coop)) {
          coopItems = data.coop.map(item => {
            const sourceName = 'Coop';
            const fullTitle = item.brandName ? `${item.brandName}: ${item.title}` : item.title;
            const extraKeywords = getExtraKeywords(fullTitle);

            const searchIndex = [
              fullTitle,
              sourceName,
              item.description,
             item.brandName,
              extraKeywords
            ].filter(Boolean).join(' ').toLowerCase();

            return {
              title: fullTitle,
              searchText: searchIndex,
              image: item.imageUrl || item.image || PLACEHOLDER_IMG,
              url: item.url || '#',
              source: sourceName,
              sourceClass: 'badge-coop'
            };
          });
        }

        const combinedDeals = [...mecenatItems, ...hyresgastItems, ...icaItems, ...coopItems];

        allDeals = shuffleArray(combinedDeals, 42);

        renderDeals(allDeals);

      } catch (error) {
        console.error('Ett fel uppstod vid läsning av data.json:', error);
        document.getElementById('grid').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Kunde inte läsa data.json. Se konsolen för detaljer.</p>';
      }
    }

    function renderDeals(deals) {
      const grid = document.getElementById('grid');
      const stats = document.getElementById('stats');
      grid.innerHTML = '';

      stats.innerText = `Visar ${deals.length} av ${allDeals.length} rabatter`;

      if (deals.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Inga rabatter matchade din sökning.</p>';
        return;
      }

      deals.forEach(deal => {
        const card = document.createElement('div');
        card.className = 'card';

        card.innerHTML = `
          <div class="card-img-wrapper">
            <img class="card-img" src="${deal.image || PLACEHOLDER_IMG}" alt="" loading="lazy">
            <span class="badge ${deal.sourceClass}">${deal.source}</span>
          </div>
          <div class="card-content">
            <h2 class="card-title">${deal.title}</h2>
            <a href="${deal.url}" target="_blank" rel="noopener noreferrer" class="card-link">Visa rabatt</a>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase().trim();
      const terms = query.split(/\s+/).filter(Boolean);

      if (terms.length === 0) {
        renderDeals(allDeals);
        return;
      }

      const filtered = allDeals.filter(deal => {
        return terms.every(term => deal.searchText.includes(term));
      });

      renderDeals(filtered);
    });

    loadData();
  </script>
